name: Build and Publish NuGet Packages

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet projects only
        run: |
          dotnet restore DocWeave/DocWeave.csproj
          dotnet restore DocWeaveNS/DocWeaveNS.csproj

      - name: Build NuGet projects only
        run: |
          dotnet build DocWeave/DocWeave.csproj --configuration Release
          dotnet build DocWeaveNS/DocWeaveNS.csproj --configuration Release

      - name: Pack NuGet packages
        run: |
          dotnet pack DocWeave/DocWeave.csproj --configuration Release --output ./artifacts
          dotnet pack DocWeaveNS/DocWeaveNS.csproj --configuration Release --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

  publish:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: Publish to NuGet.org (Trusted Publishing)
        run: dotnet nuget push "./packages/*.nupkg" --source "https://api.nuget.org/v3/index.json"
